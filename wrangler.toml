# ==========================================
# CONFIGURACIÓN DE CLOUDFLARE PAGES Y WORKERS
# ==========================================

name = "suprime-store"
compatibility_date = "2026-09-20"

# Directorio donde Cloudflare buscará los archivos estáticos compilados
pages_build_output_dir = "artifacts/suprime-store/dist"

# ==========================================
# BINDINGS (ENLACES CON BASE DE DATOS D1)
# ==========================================
[[d1_databases]]
binding = "DB"  # Nombre que usa tu código para consultar la base de datos
database_name = "suprime-db"
database_id = "d40071e3-b844-4a68-af64-d0fd6ca8af5e" # Opcional si ya está vinculado en el panel

